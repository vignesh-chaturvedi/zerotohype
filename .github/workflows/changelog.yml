name: API changelog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node changelog-bot/run.ts
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "zerotohype-bot"
          git config user.email "zerotohype-bot@users.noreply.github.com"
          git add data/snapshots src/data
          git commit -m "Update the API changelog"
          git push
